<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajo Práctico - Game Platform</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            color: white;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 700px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 40px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .button {
            display: block;
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            background: #2563eb;
            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-3px);
            background: #1d4ed8;
        }

        .info {
            margin-top: 40px;
            color: #9ca3af;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>🎮 Game Platform</h1>

        <p class="subtitle">
            Trabajo Práctico Evaluativo
        </p>

        <div class="links">

            <a 
                href="PEGAR_AQUI_LINK_EDITOR"
                target="_blank"
                class="button">
                Prototipo en alta fidelidad — EDITOR
            </a>

            <a 
                href="PEGAR_AQUI_LINK_PRESENTACION"
                target="_blank"
                class="button">
                Prototipo — PRESENTACIÓN
            </a>

        </div>

        <div class="info">
            <p>Integrantes: Nombre Apellido — Nombre Apellido</p>
        </div>

    </main>

</body>
</html>
